<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HFOV RTMA Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0b1120;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 12px 16px 8px;
      gap: 10px;
    }

    /* ── Header Row ── */
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #93c5fd;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    #runtime {
      font-size: 0.85rem;
      color: #64748b;
      font-variant-numeric: tabular-nums;
    }

    /* ── Alert Banner ── */
    .alert-banner {
      flex-shrink: 0;
      padding: 10px 20px;
      border-radius: 8px;
      text-align: center;
      font-size: 1rem;
      font-weight: 700;
      border: 2px solid #334155;
      background: #1e293b;
      color: #94a3b8;
      transition: background 0.3s, border-color 0.3s, color 0.3s;
      letter-spacing: 0.03em;
    }
    .alert-normal  { background: #052e16; border-color: #16a34a; color: #bbf7d0; }
    .alert-warning { background: #431407; border-color: #f97316; color: #fed7aa; }
    .alert-fault   { background: #450a0a; border-color: #dc2626; color: #fecaca;
                     animation: pulse 1s ease-in-out infinite alternate; }
    @keyframes pulse { from { opacity: 1; } to { opacity: 0.7; } }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .tool {
      background: #1e293b;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: grab;
      border: 1px solid #334155;
      font-size: 0.82rem;
      color: #cbd5e1;
      user-select: none;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .tool:hover  { background: #334155; border-color: #60a5fa; transform: translateY(-1px); }
    .tool:active { cursor: grabbing; transform: translateY(0); }

    /* ── Drop Canvas ── */
    #canvas {
      flex: 1;
      background: #060d1a;
      border-radius: 10px;
      border: 1px solid #1e293b;
      position: relative;
      overflow: hidden;
      min-height: 0;
    }
    #canvas-hint {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1e293b;
      font-size: 1.1rem;
      font-weight: 600;
      pointer-events: none;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* ── Widgets ── */
    .widget {
      position: absolute;
      background: #0f1a2e;
      border: 1.5px solid #1e3a5f;
      border-radius: 10px;
      padding: 10px 12px 12px;
      cursor: move;
      color: #e2e8f0;
      min-width: 280px;
      min-height: 200px;
      resize: both;
      overflow: auto;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
      transition: border-color 0.2s;
    }
    .widget:hover { border-color: #3b82f6; }

    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid #1e293b;
      cursor: move;
      user-select: none;
    }
    .widget-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }
    .widget-close {
      cursor: pointer;
      color: #475569;
      font-weight: bold;
      font-size: 1rem;
      line-height: 1;
      padding: 0 4px;
      border-radius: 3px;
      transition: color 0.15s, background 0.15s;
    }
    .widget-close:hover { color: #ef4444; background: #1e293b; }

    /* Value display */
    .value-display {
      font-size: 2.4rem;
      font-weight: 800;
      text-align: center;
      padding: 20px 10px;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    .value-unit {
      font-size: 1rem;
      font-weight: 400;
      color: #64748b;
    }

    /* Chart container */
    .widget-chart {
      width: 100%;
      height: 200px;
      position: relative;
    }

    /* ── Reference Frequency Control ── */
    .ref-freq-control {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 5px 12px;
      margin-left: auto;   /* push to right end of toolbar */
    }
    .ref-freq-control label {
      font-size: 0.78rem;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      white-space: nowrap;
    }
    .ref-freq-input {
      width: 70px;
      background: #0f1a2e;
      border: 1px solid #334155;
      border-radius: 4px;
      color: #60a5fa;
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
      padding: 3px 6px;
      font-variant-numeric: tabular-nums;
    }
    .ref-freq-input:focus {
      outline: none;
      border-color: #60a5fa;
    }
    .ref-freq-unit {
      font-size: 0.82rem;
      color: #475569;
    }
    .ref-freq-btn {
      background: #1d4e89;
      border: none;
      border-radius: 4px;
      color: #e2e8f0;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 4px 10px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .ref-freq-btn:hover  { background: #2e75b6; }
    .ref-freq-btn:active { background: #1a3a5c; }
    .ref-freq-confirm {
      font-size: 0.75rem;
      color: #10b981;
      min-width: 40px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .ref-freq-confirm.show { opacity: 1; }
  </style>
</head>
<body>

  <div class="header-row">
    <h1>🫁 HFOV Chest Wiggle Monitor</h1>
    <span id="runtime">Runtime: 0:00:00</span>
  </div>

  <div class="alert-banner" id="alertBanner">Connecting to RTMA stream…</div>

  <div class="toolbar">
    <div class="tool" draggable="true" data-widget="frequency-value">📊 Frequency</div>
    <div class="tool" draggable="true" data-widget="snr-value">📶 SNR</div>
    <div class="tool" draggable="true" data-widget="accel-value">📡 Amplitude</div>
    <div class="tool" draggable="true" data-widget="frequency-trend">📈 Freq Trend</div>
    <div class="tool" draggable="true" data-widget="snr-trend">📉 SNR Trend</div>
    <div class="tool" draggable="true" data-widget="waveform">〰️ Waveform</div>

    <div class="ref-freq-control">
      <label>Ref Freq</label>
      <input  id="refFreqInput" class="ref-freq-input" type="number"
              min="1" max="30" step="0.5" value="10.0">
      <span class="ref-freq-unit">Hz</span>
      <button class="ref-freq-btn" onclick="sendRefFreq()">Set</button>
      <span   id="refFreqConfirm" class="ref-freq-confirm">✓ Set</span>
    </div>
  </div>

  <div id="canvas">
    <div id="canvas-hint">Drag widgets here</div>
  </div>

  <script src="dashboard.js"></script>

  <script>
    // Runtime counter — pure DOM, no impact on data pipeline
    const _start = Date.now();
    setInterval(() => {
      const s = Math.floor((Date.now() - _start) / 1000);
      const h = String(Math.floor(s / 3600)).padStart(1,'0');
      const m = String(Math.floor((s % 3600) / 60)).padStart(2,'0');
      const sc = String(s % 60).padStart(2,'0');
      document.getElementById("runtime").textContent = `Runtime: ${h}:${m}:${sc}`;
    }, 1000);

    // Reference frequency — send to Python via WebSocket → ZMQ PUSH
    function sendRefFreq() {
      const input  = document.getElementById("refFreqInput");
      const f_ref  = parseFloat(input.value);
      if (isNaN(f_ref) || f_ref <= 0) return;

      ws.send(JSON.stringify({ topic: "SetReferenceFreq", f_ref }));

      // Flash confirmation
      const confirm = document.getElementById("refFreqConfirm");
      confirm.classList.add("show");
      setTimeout(() => confirm.classList.remove("show"), 1500);
    }

    // Allow pressing Enter in the input box
    document.getElementById("refFreqInput")
      .addEventListener("keydown", e => { if (e.key === "Enter") sendRefFreq(); });

    // Hide the canvas hint once the first widget is dropped
    const _canvasHint = document.getElementById("canvas-hint");
    document.addEventListener("drop", () => {
      if (_canvasHint) _canvasHint.style.display = "none";
    }, { once: true });
  </script>
</body>
</html>
